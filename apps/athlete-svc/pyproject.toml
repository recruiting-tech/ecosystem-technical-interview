[project]
name = "athlete-svc"
version = "0.1.0"
description = "Athlete reference service. Owns athlete + registration data; publishes events via transactional outbox."
requires-python = ">=3.12,<4.0"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15,<4.0",
    "psycopg[binary]>=3.2",
    "confluent-kafka[avro,schema-registry]>=2.5",
    "fastavro>=1.9",
    "gunicorn>=23.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["athlete_svc"]
include-package-data = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "athlete_svc.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires the dev compose stack (postgres, kafka, schema-registry) to be running",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
